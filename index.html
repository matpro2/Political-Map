<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Political Profile</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="page">
    <div class="card">
        <div class="header">
            <div class="header-tag">Political Spectrum</div>
            <h1>What is your profile?</h1>
        </div>

        <div class="axes">
            <div class="axis-wrap">
                <div class="axis-labels">
                    <span class="axis-left">Competition</span>
                    <span class="axis-val" id="eV">50%</span>
                    <span class="axis-right">Empathy</span>
                </div>
                <div class="slider-track">
                    <input type="range" id="e" min="0" max="100" value="50" step="1"
                        oninput="document.getElementById('eV').textContent=this.value+'%'">
                </div>
            </div>

            <div class="axis-wrap">
                <div class="axis-labels">
                    <span class="axis-left">Conservatism</span>
                    <span class="axis-val" id="cV">50%</span>
                    <span class="axis-right">Curiosity</span>
                </div>
                <div class="slider-track">
                    <input type="range" id="c" min="0" max="100" value="50" step="1"
                        oninput="document.getElementById('cV').textContent=this.value+'%'">
                </div>
            </div>

            <div class="axis-wrap">
                <div class="axis-labels">
                    <span class="axis-left">Pragmatism</span>
                    <span class="axis-val" id="iV">50%</span>
                    <span class="axis-right">Idealism</span>
                </div>
                <div class="slider-track">
                    <input type="range" id="i" min="0" max="100" value="50" step="1"
                        oninput="document.getElementById('iV').textContent=this.value+'%'">
                </div>
            </div>
        </div>

        <div class="divider"></div>
        <button class="calc-btn" onclick="calculate()">Generate my chart →</button>
    </div>
</div>

<button class="history-btn" onclick="openHistory()" title="History">
    &#9776; History <span class="history-count" id="hist-count">0</span>
</button>

<div class="modal-overlay" id="hist-modal" onclick="if(event.target===this)this.classList.remove('on')">
    <div class="modal">
        <button class="modal-close" onclick="document.getElementById('hist-modal').classList.remove('on')">×</button>
        <h2>History</h2>
        <div class="modal-section-title">Past results</div>
        <div id="hist-list-container"></div>
    </div>
</div>

<div id="result-screen">
    <div class="result-glow"></div>
    <div class="result-tag">Your political radar</div>
    
    <div class="chart-container">
        <canvas id="radarChart"></canvas>
    </div>
    
    <button class="back-btn" onclick="goBack()">← Recalculate</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
