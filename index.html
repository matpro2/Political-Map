<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Political Profile — Interactive Radar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
    <div class="main-container">
        
        <div class="left-panel">
            <div class="header">
                <div class="header-tag">Political Spectrum</div>
                <h1>Interactive Radar</h1>
            </div>
            
            <div class="radar-box">
                <svg id="interactive-radar" viewBox="0 0 400 400" width="100%" height="100%">
                    <polygon class="radar-grid" points="200,50 330,275 70,275" />
                    <polygon class="radar-grid" points="200,125 265,237.5 135,237.5" />
                    
                    <line class="radar-axis" x1="200" y1="200" x2="200" y2="50" id="axis-idealism" data-axis="idealism" />
                    <line class="radar-axis" x1="200" y1="200" x2="330" y2="275" id="axis-curiosity" data-axis="curiosity" />
                    <line class="radar-axis" x1="200" y1="200" x2="70" y2="275" id="axis-empathy" data-axis="empathy" />
                    
                    <text class="radar-label" x="200" y="30" text-anchor="middle">Idealism</text>
                    <text class="radar-label" x="345" y="290" text-anchor="start">Curiosity</text>
                    <text class="radar-label" x="55" y="290" text-anchor="end">Empathy</text>
                    
                    <polygon id="radar-poly" points="" />
                    
                    <circle id="handle-idealism" class="radar-handle" r="12" cx="200" cy="125" data-axis="idealism" />
                    <circle id="handle-curiosity" class="radar-handle" r="12" cx="265" cy="237.5" data-axis="curiosity" />
                    <circle id="handle-empathy" class="radar-handle" r="12" cx="135" cy="237.5" data-axis="empathy" />
                </svg>
            </div>
            
            <div class="values-display">
                <div class="val-item">Idealism: <span id="val-idealism">50%</span></div>
                <div class="val-item">Curiosity: <span id="val-curiosity">50%</span></div>
                <div class="val-item">Empathy: <span id="val-empathy">50%</span></div>
            </div>

            <div class="action-buttons">
                <button class="action-btn" onclick="analyzeProfile()">Analyse</button>
                <button class="action-btn outline" id="save-btn" onclick="saveProfile()">Send</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="info-card">
                <h2 id="info-title">About the axes</h2>
                <div class="divider"></div>
                <div id="info-text">
                    <p>Hover over an axis or drag a point to reveal details about that dimension of your profile.</p>
                </div>
            </div>
        </div>

    </div>
</div>

<button class="history-btn" onclick="openHistory()" title="History">
    &#9776; History <span class="history-count" id="hist-count">0</span>
</button>

<div class="modal-overlay" id="hist-modal" onclick="if(event.target===this)this.classList.remove('on')">
    <div class="modal">
        <button class="modal-close" onclick="document.getElementById('hist-modal').classList.remove('on')">×</button>
        <h2>History</h2>
        <div class="modal-section-title">Past results</div>
        <div id="hist-list-container"></div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
